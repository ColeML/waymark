name: CI (web)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (oxlint)
        run: pnpm lint

      - name: Format check (oxfmt)
        run: pnpm fmt:check

      - name: Type check (tsc)
        run: pnpm typecheck

      - name: Tests (vitest)
        run: pnpm vitest run

      # The only step that catches a prerender-time failure: a page reading live data without
      # force-dynamic passes lint, typecheck and tests and fails here.
      - name: Build (next)
        run: pnpm build
        env:
          DATABASE_URL: postgresql://build-does-not-connect/waymark

  migrate:
    # One at a time. Two merges landing close together would otherwise run two migrators against
    # the same database, both trying to apply the same pending migration.
    concurrency:
      group: migrate-main
      cancel-in-progress: false
    # Migrations run here rather than in the Vercel build: a build that also migrates would take
    # the site down when a migration fails, and Vercel builds run on every preview branch too.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations (drizzle-kit)
        run: pnpm db:migrate
        env:
          # The direct connection. A migration through the pooler can fail in ways that look like
          # a broken migration rather than a wrong connection string.
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
